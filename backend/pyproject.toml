[project]
name = "afterglow-backend"
version = "0.1.0"
description = "Afterglow data pipeline: MODIS/VIIRS hotspot harmonization -> static JSON API (see ../backend.md)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "shapely>=2.0",
  "h5py>=3.10",
  "rasterio>=1.3",
  "Pillow>=10",
  "httpx>=0.27",
  "sgp4>=2.23",
  "pyproj>=3.6",
  "pyyaml>=6",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
afterglow = "afterglow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["afterglow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
